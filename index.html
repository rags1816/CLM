<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLM Suite — Contract Lifecycle Management</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');
  :root{
    --ink:#161b22; --paper:#f6f5f1; --panel:#ffffff; --line:#dcd9d0;
    --slate:#3a4a5c; --gold:#a8792e; --t1:#7a2e2e; --t2:#a8792e; --t3:#3a6b5c; --t4:#6b7280;
    --muted:#6b6459; --green:#2f6f4f; --red:#a13b3b; --amber:#b8892f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Newsreader',serif;font-weight:500;margin:0 0 8px;letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;}
  .muted{color:var(--muted);}
  a{color:var(--slate);}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  input,select,textarea{font-family:'Inter',sans-serif;}

  #topbar{position:sticky;top:0;z-index:50;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:54px;}
  #topbar .brand{font-family:'Newsreader',serif;font-size:18px;letter-spacing:0.01em;display:flex;align-items:center;gap:8px;}
  #topbar .brand .tag{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#a39a89;letter-spacing:0.1em;border:1px solid #3a3f47;padding:2px 6px;border-radius:2px;}
  #nav{display:flex;align-items:center;gap:8px;}
  #navToggle{display:none;background:none;border:1px solid #3a3f47;color:#c9c2b4;font-size:16px;line-height:1;padding:6px 10px;border-radius:2px;cursor:pointer;}
  #navList{display:flex;gap:2px;flex-wrap:wrap;}
  #navList button{background:none;border:none;color:#c9c2b4;font-size:12.5px;padding:8px 10px;border-radius:2px;letter-spacing:0.02em;}
  #navList button:hover{background:#232830;color:#fff;}
  #navList button.active{background:var(--gold);color:#1c1408;font-weight:600;}
  @media (max-width:768px){
    #navToggle{display:block;}
    #navList{display:none;flex-direction:column;position:absolute;top:54px;left:0;right:0;background:var(--ink);z-index:60;padding:8px 16px 16px;box-shadow:0 8px 20px rgba(0,0,0,0.3);}
    #navList.open{display:flex;}
    #navList button{padding:12px 10px;text-align:left;width:100%;}
  }

  #app{max-width:960px;margin:0 auto;padding:24px 18px 100px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:20px;margin-bottom:16px;}
  .card h2{font-size:20px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .col{flex:1;min-width:180px;}
  label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:var(--slate);}
  input[type=text],input[type=date],input[type=number],select,textarea{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:2px;background:#fdfdfb;font-size:13.5px;color:var(--ink);
  }
  textarea{resize:vertical;min-height:70px;}
  .field{margin-bottom:14px;}
  .btn{background:var(--ink);color:var(--paper);border:none;padding:9px 16px;border-radius:2px;font-size:13px;font-weight:600;letter-spacing:0.01em;}
  .btn:hover{background:#2a323d;}
  .btn.gold{background:var(--gold);color:#1c1408;}
  .btn.outline{background:none;border:1px solid var(--ink);color:var(--ink);}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn.danger{background:none;border:1px solid var(--red);color:var(--red);}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 8px;}
  td{border-bottom:1px solid #ece9e1;padding:7px 8px;vertical-align:top;}
  tr:hover td{background:#faf9f6;}

  .badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:2px 7px;border-radius:2px;color:#fff;letter-spacing:0.03em;}
  .badge.t1{background:var(--t1);} .badge.t2{background:var(--t2);} .badge.t3{background:var(--t3);} .badge.t4{background:var(--t4);}
  .badge.ok{background:var(--green);} .badge.due{background:var(--amber);} .badge.overdue{background:var(--red);}
  .badge.gold{background:#a8792e;} .badge.silver{background:#7c8591;} .badge.bronze{background:#8c5a3c;}
  .badge.terr{background:var(--red);}

  .hero{padding:36px 0 20px;}
  .hero h1{font-size:36px;line-height:1.1;max-width:16ch;}
  .hero p{max-width:58ch;color:var(--muted);font-size:15px;line-height:1.6;}
  .pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:20px;}
  .pillar{border:1px solid var(--line);background:var(--panel);padding:14px;border-radius:2px;}
  .pillar .n{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gold);}
  .pillar h3{font-size:14.5px;margin:4px 0 4px;}
  .pillar p{font-size:12.5px;color:var(--muted);margin:0;line-height:1.45;}
  .stepper{margin-top:20px;}
  .stepper-dots{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .stepper-dots button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-family:'IBM Plex Mono',monospace;font-size:10.5px;cursor:pointer;color:var(--muted);padding:0;}
  .stepper-dots button.active{background:var(--gold);color:#1a1a1a;border-color:var(--gold);font-weight:700;}
  .stepper-card{border:1px solid var(--line);background:var(--panel);padding:24px;border-radius:2px;min-height:150px;}
  .stepper-card .n{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);}
  .stepper-card h3{font-size:19px;margin:6px 0 8px;}
  .stepper-card p{font-size:13.5px;color:var(--muted);line-height:1.55;margin:0;}
  .stepper-nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
  .stepper-nav button{background:none;border:1px solid var(--line);border-radius:2px;padding:8px 14px;font-size:13px;cursor:pointer;color:var(--ink);}
  .stepper-nav button:disabled{opacity:0.35;cursor:default;}
  .stepper-nav .step-count{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);}

  .slider-row{margin-bottom:18px;}
  .slider-head{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:2px;}
  .slider-score{font-family:'IBM Plex Mono',monospace;color:var(--slate);}
  input[type=range]{width:100%;-webkit-appearance:none;height:3px;background:var(--line);border-radius:2px;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--slate);cursor:pointer;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--slate);}

  .result-strip{background:var(--ink);color:var(--paper);padding:16px 18px;border-radius:2px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .result-strip .tname{font-family:'Newsreader',serif;font-size:22px;}
  .result-strip .tscore{font-family:'IBM Plex Mono',monospace;font-size:24px;}

  #floaterBtn{position:fixed;bottom:20px;right:20px;width:46px;height:46px;border-radius:50%;background:var(--gold);color:#1c1408;border:none;font-size:18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,0.25);z-index:80;font-family:'Newsreader',serif;}
  #floaterPanel{position:fixed;bottom:76px;right:20px;width:290px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:0 8px 28px rgba(0,0,0,0.2);padding:16px;z-index:80;}
  #floaterPanel h4{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--gold);margin:0 0 10px;}
  #floaterPanel li{font-size:12.5px;line-height:1.5;margin-bottom:8px;color:var(--ink);}
  #floaterPanel[hidden]{display:none;}

  .pill{display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;border:1px solid var(--line);margin-right:6px;margin-bottom:6px;background:#fdfdfb;}
  .flex-between{display:flex;justify-content:space-between;align-items:center;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:640px){.grid2{grid-template-columns:1fr;}}
  .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
  .divider{border:none;border-top:1px solid var(--line);margin:18px 0;}
  .mdbody h2{font-size:19px;margin-top:22px;}
  .mdbody h3{font-size:15.5px;margin-top:16px;}
  .mdbody p,.mdbody li{font-size:13.5px;line-height:1.6;color:#2a2f36;}
  .mdbody table{margin:10px 0;}
  .small{font-size:12px;color:var(--muted);}
  .bar-track{height:8px;background:var(--line);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:4px;}

  #tourOverlay{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;z-index:95;pointer-events:none;padding:16px;}
  #tourCard{pointer-events:auto;background:var(--ink);color:var(--paper);border-radius:6px;padding:16px 20px;max-width:480px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,0.35);}
  #tourCard.collapsed{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;max-width:220px;cursor:move;}
  #tourCard .mono{color:var(--gold);}
  .stagingRow{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);padding:8px 0;}
  .stagingRow .txt{flex:1;font-size:12.5px;line-height:1.4;}

  .cbanner{border:1px solid var(--line);border-radius:2px;margin-bottom:14px;overflow:hidden;background:var(--panel);}
  .cbanner-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;cursor:pointer;background:#faf9f6;}
  .cbanner-head b{font-size:12.5px;}
  .cbanner-body{padding:10px 12px;font-size:12.5px;}
  .cbanner.collapsed .cbanner-body{display:none;}
  .cbanner.amber .cbanner-head{border-left:3px solid var(--amber);}
  .cbanner.sticky{position:sticky;top:54px;z-index:40;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
  .cbanner-toggle{background:none;border:1px solid var(--line);color:var(--slate);font-size:11px;padding:3px 9px;border-radius:2px;}
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">CLM Suite <span class="tag" id="versionTag">v?</span></div>
  <div id="nav"></div>
</div>
<div id="app"></div>

<button id="floaterBtn" title="Guide">?</button>
<div id="floaterPanel" hidden></div>

<script>
/* ============================================================
   CLM SUITE — Contract Lifecycle Management
   Single-file, self-contained. No install, no server, no account.
   Data lives in localStorage on this device only.
   ============================================================ */

/* ---------- constants ---------- */
/* ---------- version (single source of truth — bump this, nothing else) ---------- */
const APP_VERSION = '2.8.2';

const SCREENS = [
  {id:'about', label:'About'},
  {id:'intake', label:'Contract Intake'},
  {id:'tiering', label:'0 · Tiering'},
  {id:'framework', label:'Contract Playbook'},
  {id:'register', label:'Obligations/SLA/CO'},
  {id:'rebates', label:'Rebates'},
  {id:'coverage', label:'Coverage & Feedback'},
  {id:'qbr', label:'QBR'},
  {id:'brief', label:'Contract Brief'},
  {id:'scorecard', label:'Maturity'},
  {id:'governance', label:'Governance'},
  {id:'settings', label:'⚙ Settings'}
];

const TIERS = [
  {min:3.6, name:'Strategic', code:'t1',
   workflow:['Named relationship owner accountable for the account','Full quarterly business review (QBR) with live KPI/SLA dashboard','Obligation & SLA tracking fully automated, 30/60/90-day alerts','Joint Business Planning (JBP) and innovation/collaboration roadmap','Change control via formal board sign-off (legal + category lead)','Termination/renewal notice flagged 120+ days in advance']},
  {min:2.8, name:'Managed', code:'t2',
   workflow:['Category owner responsible, no dedicated relationship lead required','Semi-annual performance review against defined KPIs','Automated obligation and SLA alerts, manual escalation','Rebate/credit reconciliation on a quarterly cycle','Standard change control, materiality-based approval','Renewal notice flagged 90 days in advance']},
  {min:1.8, name:'Transactional', code:'t3',
   workflow:['Managed by category/ops team as part of broader portfolio','Annual or exception-based review only','Automated renewal and compliance alerts, no active KPI tracking','Amendments via lightweight approval, no formal board','Renewal notice flagged 60 days in advance']},
  {min:0, name:'Routine / Leverage', code:'t4',
   workflow:['Compliance-only oversight, no active management cycle','System-generated renewal alert is the only required touchpoint','Reviewed only if flagged by spend anomaly or supplier issue','Candidate for consolidation or catalogue/PO buying instead']}
];

// Returned by getTier when a score can't be matched to any real tier (NaN from a missing/
// corrupted axis value, or a negative score from a corrupted one) -- NOT part of TIERS, so it's
// never silently counted as Routine/Leverage in the portfolio table, heatmap, or governance mix.
const TIER_ERROR = {min:null, name:'⚠ Data error', code:'terr',
  workflow:['This contract\'s tiering score could not be calculated — one or more axis scores (Value/Risk/Criticality/Impact) is missing or invalid.','Do not treat this as Routine/Leverage — the real risk level is unknown until repaired.','Re-open Tiering and reset this contract\'s sliders (or re-enter the row) to repair it.']};

function weightedScore(v){ return v.value*0.3 + v.risk*0.3 + v.criticality*0.2 + v.impact*0.2; }
function getTier(score){
  const t = TIERS.find(t=>score>=t.min);
  return t || TIER_ERROR; // never silently downgrade an unmatched (NaN/corrupted) score to the lowest tier
}

/* Naming scheme: 'standard' (Strategic/Managed/Transactional/Routine) or
   'gsb' (Gold/Silver/Bronze — the recognised public-procurement/GCF naming).
   GSB is a 3-band scheme, so Transactional + Routine both display as Bronze —
   the underlying 4-way score/tier engine is unchanged either way. */
const GSB_LABELS = {t1:'🥇 Gold', t2:'🥈 Silver', t3:'🥉 Bronze', t4:'🥉 Bronze'};
const GSB_CLASS = {t1:'gold', t2:'silver', t3:'bronze', t4:'bronze'};
function tierDisplayName(code){
  if(code==='terr') return TIER_ERROR.name;
  if(STATE.tierScheme==='gsb') return GSB_LABELS[code];
  return TIERS.find(t=>t.code===code).name;
}
function tierBadgeClass(code){
  if(code==='terr') return 'terr';
  return STATE.tierScheme==='gsb' ? GSB_CLASS[code] : code;
}
function tierBucketCounts(bulk){
  if(STATE.tierScheme==='gsb'){
    const counts={t1:0,t2:0,t3:0};
    bulk.forEach(r=>{ const code=getTier(weightedScore(r)).code; counts[code==='t4'?'t3':code]++; });
    return [
      {code:'t1', label:GSB_LABELS.t1, cls:'gold', count:counts.t1},
      {code:'t2', label:GSB_LABELS.t2, cls:'silver', count:counts.t2},
      {code:'t3', label:GSB_LABELS.t3, cls:'bronze', count:counts.t3}
    ];
  }
  const counts={t1:0,t2:0,t3:0,t4:0};
  bulk.forEach(r=>{ counts[getTier(weightedScore(r)).code]++; });
  return TIERS.map(t=>({code:t.code, label:t.name, cls:t.code, count:counts[t.code]}));
}

const GUIDE_TIPS = {
  about:['This is the front door — the pitch, the framework at a glance, and where to start.','Head to Settings first if you want AI drafting (Claude/Gemini) rather than Sandbox mode.','See the "offline vs. internet" card below for what needs a connection.','Use the ‹ Previous / Next › chevrons to step through Sections 0–7 one at a time.'],
  intake:['This is the no-document path: enter a contract summary directly instead of uploading the signed contract itself — this app is not meant to be your contract repository.','Optional AI step at the top: describe the contract in plain English and "Suggest with AI" pre-fills tier scores, obligations, SLAs and rebate terms below — you review and edit every field before anything is created.','One submission seeds Tiering, the Register, and Rebates in a single pass — review and refine each on its own tab afterwards.','Obligations/SLAs/KPIs — one per line; a due date after each line in parentheses is picked up automatically, e.g. "Insurance renewal (2027-01-15)".','Leave the rebate fields blank if this contract has no rebate — nothing is created if threshold/rate are both empty.'],
  tiering:['Score one contract with the sliders, or paste several into the bulk table to test auto-tiering.','Weights: Value & Risk 30% each, Criticality & Impact 20% each — tune the logic to your risk appetite in code if needed.','"AI score contract list" works even in Sandbox mode (offline heuristic) — no connection required.','Upload a .docx/.pdf under "Upload & Analyze Contract" (up to 350 pages) to set it as the active contract — it\'s reused automatically across QBR, Rebates, and Register, no separate upload needed on those tabs. It now also adds/updates this contract\'s row in the bulk table below automatically, so it shows up on the heatmap without a manual second step.','The bulk table also has optional UNSPSC/CPV code fields — manual entry only, no lookup or validation.','Uploading a confidential contract? Check the badge above the upload box: Sandbox keeps it fully local (offline heuristics); Claude/Gemini sends it out for a higher-fidelity AI read. Switch modes in ⚙ Settings first if you need to.'],
  framework:['The full 0–7 Contract Playbook, plus benchmarking references (CIPS, Hackett, WorldCC).','"+ Add starter" buttons now require picking a target contract first — starter content goes to that contract\'s Register/QBR/Rebates record specifically, never to whichever one happens to be open elsewhere.','Use "AI draft executive summary" to tailor it to your org profile — works offline in Sandbox mode too.','Word export needs internet once per session to load the library; falls back to a plain .doc file if blocked.','If a contract is active (uploaded on Tiering), the summary is grounded in a full-document AI review of it, not just your org profile fields — long documents offer a quick vs. full review choice with a cost estimate first.'],
  qbr:['This screen holds many QBRs, one per supplier/period — open the picker at the top to switch between them or start a new one.','Fill supplier, period, KPIs and SLAs — then let AI draft the narrative summary from what you\'ve entered.','Word export falls back automatically if offline; PowerPoint export has no offline fallback and needs a connection.','If a contract is active, "AI Extract KPIs/SLAs" pulls them straight from it — offers the same quick vs. full review choice as elsewhere for long documents.','The 📄 Active: badge at the top shows which contract "AI Extract KPIs/SLAs" would use.','Governance now rolls up risk across every saved QBR, not just the one currently open.'],
  rebates:['Track tier thresholds against actual spend — accrued entitlement is calculated live, not typed in.','Reconcile against the supplier\'s own statement each cycle and flag variances as Disputed rather than letting them go quiet.','If a contract is active, "AI Extract Rebates" pulls rebate tiers straight from it — same quick vs. full review choice as elsewhere for long documents.','The 📄 Active: badge at the top shows which contract "AI Extract Rebates" would use.'],
  register:['One register for obligations, SLAs, and change orders — filter by type. Status auto-flags overdue items by due date.','Change orders live here rather than on their own screen, so scope drift on a contract stays with the obligations/SLAs it affects — set the Type dropdown on any row. Clause extraction below detects obligation/SLA-style language, not change-order language, so those are added manually or via the Contract Playbook.','Upload the contract once on the 0 · Tiering tab (Step 0) — this tab reflects it automatically under "Contract Analysis & Staging," with candidate obligation/SLA clauses staged for your review. Or use Contract Intake to add items directly without a document.','The "AI document review" panel below runs a full structured review of the active contract — long documents (over ~6,000 characters) show a chunk-count and cost estimate first, with a choice between a full chunked review (covers the whole document) or a quick first-section-only pass.','Its suggested tier is sourced from the same cached AI document review Tiering uses — no separate, possibly-disagreeing estimate.'],
  coverage:['Three logs in one place: category spend coverage, stakeholder feedback, and supplier collaboration opportunities.','% spend under contract here feeds the Governance rollup — keep it current, it\'s the headline leakage indicator.'],
  scorecard:['Score your organisation 1–5 across each dimension. This feeds the Governance rollup.','Re-run quarterly to track maturity trend.','This maturity assessment is CLM Suite\'s own model — 15 questions across 6 dimensions. It\'s informed by, but not copied from, CIPS/Hackett/WorldCC research; see the Contract Playbook tab for the specific benchmarks.'],
  governance:['This is the CPO-facing rollup: spend coverage, tier mix, overdue obligations, maturity gaps — the value-leak view.','Everything here is computed live from the other tabs.','PowerPoint deck export needs internet to load the library once per session.','Risks and to-do now also cover breached QBRs and top-tier contracts missing a QBR entirely, aggregated across every saved QBR, not just the one open.','🔔 Renewal & Obligation Watch scans every open register item portfolio-wide for anything overdue or due soon.','🔍 Cross-Contract Pattern Scan looks for themes recurring across multiple contracts at once — needs at least 2 contracts with data.'],
  brief:['A two-page handover document for one contract — pick a contract, and it pulls together tiering, key dates, rebate status, top risks, and recent feedback from every other tab automatically.','This is the document a procurement manager would hand to the contract manager taking over day-to-day ownership — separate from the QBR (a periodic performance review) and the Contract Playbook (the whole methodology).','"Draft handover narrative" writes a short AI paragraph grounding the brief in what\'s actually on file — works in Sandbox mode too, offline.','Export to Word for a clean two-page document; nothing here is stored beyond what already exists on the other tabs.'],
  settings:['Sandbox mode drafts offline using templates — no key needed, good for testing.','Claude/Gemini calls go direct from your browser to the provider API using your own key. Keys are stored only in this browser\'s localStorage, never sent anywhere else by this app.','Set a fallback provider so a blocked/failed call still returns something useful (Sandbox is the safest default).','"Ground with web search" is off by default — without it, AI drafts come from trained knowledge only, not a live lookup.','"Test connection" and other AI calls now surface the actual API error message on failure (e.g. bad key, blocked network) rather than just a generic error.','The full-document "AI document review" (Tiering/Register/Rebates/QBR) uses Gemini directly when Primary mode is Claude or Gemini, regardless of which of those two is selected — that keeps its cost estimate accurate. In Sandbox mode it stays fully local instead — no Gemini call is made even if a Gemini key is stored.','Uploading on a non-Sandbox mode with a Gemini key set shows a one-time confirmation before the first upload each session, since that document\'s content will actually be sent to Gemini.']
};

const SCORECARD_QUESTIONS = [
  {id:'d1',dim:'Foundation & Data', text:'Contracts are held in a structured repository with tagged metadata (not just PDFs in folders).'},
  {id:'d2',dim:'Foundation & Data', text:'Every contract is mapped to a category taxonomy and a management tier at signature.'},
  {id:'d3',dim:'Obligations', text:'Obligations are extracted and logged at signature, not discovered later by re-reading contracts.'},
  {id:'d4',dim:'Obligations', text:'Obligation owners sit with the business, not solely with procurement.'},
  {id:'d5',dim:'KPIs & SLAs', text:'KPIs and SLA thresholds are defined pre-signature with clear formulas and data sources.'},

const FRAMEWORK_MD = `
## Section 0 — Foundation & Pre-Contract Tiering
Every feature below depends on structured contract metadata, not PDFs in a folder. Core metadata: type, category, value, dates, renewal type, owner, risk tier. A clause library should tag key clauses (termination, liability, SLA, price adjustment, audit rights) so obligations and SLAs auto-populate a register rather than living in prose.

**Pre-contract tiering** segments contracts by Value, Risk, Criticality and Business Impact (1–5 each) into four tiers — Strategic, Managed, Transactional, Routine/Leverage — which sets the default management intensity for everything downstream. Score at signature; re-score on amendment, supplier risk event, or spend threshold breach.

## Section 1 — Obligation Tracking
Every deliverable, deadline, notice, and compliance requirement extracted into a trackable task: description, owner (business, not just procurement), due date, recurrence, evidence required, escalation path. Automated reminders at 30/60/90 days. Top-quartile organisations track over 90% of obligations with automated alerts (Hackett); median organisations still do this reactively in spreadsheets.

## Section 2 — KPIs
Defined pre-signature, not after: formula, data source, frequency, target/threshold written into the contract. Fed from operational systems into a live scorecard rather than manual quarterly collection.

## Section 3 — SLAs
Time/quality-bound commitments with financial consequences. Tiered breach mechanism (informal flag → formal notice → escalation → remedy/credit), with credit calculation automated — manual SLA credit tracking is a common source of value leakage.

## Section 4 — Rebate Monitoring
Rebate/tier entitlements linked to actual ERP/P2P spend data, with a running accrual-vs-entitlement view and quarterly reconciliation against supplier statements. Consistently one of the highest-value, least-visible leakage sources in benchmarking studies.

## Section 5 — Contract Change Orders / Amendments
Formal change control: request → impact assessment → materiality-based approval → version control with full audit trail. Every amendment should re-trigger the obligation/KPI/SLA register.

## Section 6 — Termination
Notice windows and auto-renewal triggers flagged 90–120 days ahead. Exit/transition checklist: knowledge transfer, data return, TSA if needed, final reconciliation. "% of contracts with unwanted auto-renewal" is a named red-flag metric in Hackett benchmarking.

## Section 7 — QBR (Quarterly Business Review)
Standard template auto-populated from KPI/SLA/spend/risk/rebate data. Intensity tiered by supplier segment — not every supplier needs a full QBR. Action items must feed back into the obligation tracker, closing the loop.

## Stakeholder Feedback, Spend & Category Coverage
Structured post-QBR stakeholder surveys tied to specific KPIs, not generic satisfaction checks. A spend cube mapped against the contract repository gives % of spend under active contract. A category × contract-status heatmap surfaces white space and prioritises where to build coverage next. Collaboration opportunities — joint business planning, innovation logs, gain-share — should be surfaced directly from QBR data for top-tier suppliers.

## Best Practice Reference Points
**CIPS's Contract Management Cycle** frames contract management as a distinct post-award competency — implementation, ongoing management, review, close-out — with strong emphasis on relationship management and risk, not just compliance administration.

**The Hackett Group's procurement benchmarking research (Digital World Class®)** shows top-quartile firms managing 97%+ of spend under contract, versus roughly 70% for typical organisations — with contract compliance rate, amendment cycle time, and % obligations tracked with automation as recurring benchmark metrics. The gap between top-quartile and median performers is driven by automation and pre-signature discipline, not raw effort.

**WorldCC (formerly IACCM)** research puts average value leakage from poor contract/commercial management at roughly **9% of contract value** — a figure WorldCC has restated consistently since an original ~9.2% IACCM estimate — largely unmanaged obligations, unclaimed rebates/credits, and missed renegotiation windows. Their contracting-capability maturity assessment work is a useful self-assessment reference (specific stage-naming varies by source).
`;

/* ---------- charts (canvas-based: same drawing fns power on-screen + exported images) ---------- */
function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight){
  const words = String(text).split(' ');
  let line='', lines=[];
  words.forEach(w=>{
    const test = line?line+' '+w:w;
    if(ctx.measureText(test).width>maxWidth && line){ lines.push(line); line=w; } else line=test;
  });
  if(line) lines.push(line);
  const startY = y - (lines.length-1)*lineHeight/2;
  lines.forEach((l,i)=> ctx.fillText(l, x, startY+i*lineHeight));
}
function truncateLabel(ctx, text, maxWidth){
  if(ctx.measureText(text).width <= maxWidth) return text;
  let t = text;
  while(t.length>1 && ctx.measureText(t+'…').width > maxWidth){ t = t.slice(0,-1); }
  return t+'…';
}
function drawBarChart(ctx, w, h, data, opts={}){
  ctx.clearRect(0,0,w,h);
  const pad = {l:opts.labelWidth||100,r:24,t:16,b:16};
  const max = opts.max || Math.max(...data.map(d=>d.value),1);
  const rowH = (h-pad.t-pad.b)/Math.max(data.length,1);
  ctx.font = '11px Inter, sans-serif';
  data.forEach((d,i)=>{
    const y = pad.t + i*rowH + rowH*0.22;
    const barH = rowH*0.56;
    const barW = Math.max((w-pad.l-pad.r) * (Math.min(d.value,max)/max), 1);
    ctx.fillStyle = '#6b6459';
    ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.fillText(truncateLabel(ctx, d.label, pad.l-12), pad.l-8, y+barH/2);
    ctx.fillStyle = d.color || '#a8792e';
    ctx.fillRect(pad.l, y, barW, barH);
    ctx.fillStyle = '#161b22';
    ctx.textAlign='left';
    ctx.fillText(opts.unit==='pct' ? d.value.toFixed(0)+'%' : d.value.toLocaleString(undefined,{maximumFractionDigits:1}), pad.l+barW+6, y+barH/2);
  });
}
function drawDonutChart(ctx, w, h, data, opts={}){
  ctx.clearRect(0,0,w,h);
  const total = data.reduce((a,d)=>a+d.value,0) || 1;
  const cx = w*0.32, cy=h/2, rOuter=Math.min(w*0.28,h*0.42), rInner=rOuter*0.55;
  let angle=-Math.PI/2;
  data.forEach(d=>{
    const slice = (d.value/total)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,rOuter,angle,angle+(slice||0.0001));
    ctx.closePath();
    ctx.fillStyle = d.color;
    ctx.fill();
    angle += slice;
  });
  ctx.globalCompositeOperation='destination-out';
  ctx.beginPath(); ctx.arc(cx,cy,rInner,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation='source-over';
  ctx.font='11px Inter, sans-serif'; ctx.textBaseline='middle';
  let ly = cy - (data.length-1)*9;
  data.forEach(d=>{
    ctx.fillStyle = d.color;
    ctx.fillRect(w*0.62, ly-5, 10, 10);
    ctx.fillStyle = '#161b22'; ctx.textAlign='left';
    ctx.fillText(`${d.label} (${d.value})`, w*0.62+15, ly);
    ly += 18;
  });
}
function drawRadarChart(ctx, w, h, data, opts={}){
  ctx.clearRect(0,0,w,h);
  const cx=w/2, cy=h/2-4, r=Math.min(w,h)*0.30;
  const n=data.length;
  const maxVal = opts.max||5;
  for(let ring=1; ring<=4; ring++){
    ctx.strokeStyle='#dcd9d0';
    ctx.beginPath();
    for(let i=0;i<=n;i++){
      const a = -Math.PI/2 + (i%n)*(2*Math.PI/n);
      const rr = r*ring/4;
      const x = cx+rr*Math.cos(a), y=cy+rr*Math.sin(a);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  ctx.font='10px Inter, sans-serif';
  data.forEach((d,i)=>{
    const a = -Math.PI/2 + i*(2*Math.PI/n);
    const x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
    ctx.strokeStyle='#dcd9d0';
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y); ctx.stroke();
    const lx = cx+(r+16)*Math.cos(a), ly=cy+(r+16)*Math.sin(a);
    ctx.textAlign = Math.cos(a)>0.3?'left':(Math.cos(a)<-0.3?'right':'center');
    ctx.fillStyle='#3a4a5c';
    wrapCanvasText(ctx, d.label, lx, ly, 74, 11);
  });
  ctx.beginPath();
  data.forEach((d,i)=>{
    const a = -Math.PI/2 + i*(2*Math.PI/n);
    const rr = r*(Math.min(d.value,maxVal)/maxVal);
    const x=cx+rr*Math.cos(a), y=cy+rr*Math.sin(a);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.closePath();
  ctx.fillStyle='rgba(168,121,46,0.35)';
  ctx.strokeStyle='#a8792e'; ctx.lineWidth=2;
  ctx.fill(); ctx.stroke();
}

function loadState(){
  try{
    const raw = window.localStorage.getItem('clm_suite_state');
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
    const parsed = JSON.parse(raw);
    const state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    const merge = (target, source) => {
      for (const key in source) {
        if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
          if (!target[key]) target[key] = {};
          merge(target[key], source[key]);
        } else {
          target[key] = source[key];
        }
      }
    };
    merge(state, parsed);
    // v2.5 -> v2.6 migration: a single STATE.qbr used to be the only QBR record. If this state
    // predates STATE.qbrs and that single QBR has real content, file it into the collection once
    // so it isn't silently dropped when the multi-QBR picker takes over.
    if((!state.qbrs || state.qbrs.length===0) && state.qbr && state.qbr.supplier){
      const migrated = JSON.parse(JSON.stringify(state.qbr));
      migrated.id = migrated.id || uid();
      state.qbrs = [migrated];
      state.qbrOpenId = migrated.id;
      state.qbr.id = migrated.id;
    }
    return state;
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULT_STATE)); }
}

/* Days from today (local calendar day) to a 'YYYY-MM-DD' due date. Negative = overdue.
   Parses/compares local calendar days only — no UTC-midnight-vs-local-now skew. */
function daysUntil(dateStr){
  if(!dateStr) return null;
  const [y,m,d] = dateStr.split('-').map(Number);
  const due = new Date(y, m-1, d);
  const today = new Date();
  today.setHours(0,0,0,0);
  return Math.round((due-today)/86400000);
}

function mdToHtmlClean(md){
  const esc2 = s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines = md.split('\n');
  let html='', inList=false;
  for(let raw of lines){
    let line = raw.trim();
    if(!line){ if(inList){html+='</ul>';inList=false;} continue; }
    if(line.startsWith('## ')){ if(inList){html+='</ul>';inList=false;} html+=`<h2>${esc2(line.slice(3))}</h2>`; continue; }
    if(line.startsWith('### ')){ if(inList){html+='</ul>';inList=false;} html+=`<h3>${esc2(line.slice(4))}</h3>`; continue; }
    let body = esc2(line.startsWith('- ')?line.slice(2):line);
    body = body.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    if(line.startsWith('- ')){ if(!inList){html+='<ul>';inList=true;} html+=`<li>${body}</li>`; continue; }
    if(inList){html+='</ul>';inList=false;}
    html+=`<p>${body}</p>`;
  }
  if(inList) html+='</ul>';
  return html;
}

function formatNetworkError(err, mode) {
  let detail = err.message || String(err);
  if (detail.includes('Failed to fetch') || detail.includes('NetworkError') || detail.includes('Failed to load resource')) {
    if (window.location.protocol === 'file:') {
      return `${detail} (CORS policy blocked direct API access from the file:// protocol). Rationale: Browsers block direct network requests to security-sensitive API endpoints (especially Anthropic/Claude) from local files for safety. Fix: Run a local web server (e.g. run "python -m http.server" in this folder, then open "http://localhost:8000") or use Gemini, which supports direct browser requests from local files.`;
    } else {
      return `${detail}. Check your internet connection or company proxy/firewall, as calls to the ${mode === 'claude' ? 'Anthropic' : 'Google'} API gateway might be blocked.`;
    }
  }
  return detail;
}

const AI_TIMEOUT_MS = 30000;
async function fetchWithTimeout(url, options){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), AI_TIMEOUT_MS);
  try{
    return await fetch(url, {...options, signal: controller.signal});
  }catch(e){
    if(e.name==='AbortError') throw new Error('Request timed out after 30s');
    throw e;
  }finally{
    clearTimeout(timer);
  }
}
async function askAI(prompt){
  const mode = STATE.ai.mode;
  try{
    if(mode==='claude') return await askClaude(prompt);
    if(mode==='gemini') return await askGemini(prompt);
    return await sandboxAnswer(prompt);
  }catch(primaryErr){
    const fb = STATE.ai.fallbackMode;
    const formattedError = formatNetworkError(primaryErr, mode);
    if(fb && fb!=='none' && fb!==mode){
      try{
        let text;
        if(fb==='claude') text = await askClaude(prompt);
        else if(fb==='gemini') text = await askGemini(prompt);
        else text = await sandboxAnswer(prompt);
        return `[Primary (${mode}) failed: ${formattedError} — used fallback: ${fb}]\n\n${text}`;
      }catch(fallbackErr){
        throw new Error(formattedError+' — fallback ('+fb+') also failed: '+formatNetworkError(fallbackErr, fb));
      }
    }
    throw new Error(formattedError);
  }
}
async function askClaude(prompt){
  if(!STATE.ai.claudeKey) throw new Error('No Claude API key set in Settings.');
  const body = { model: STATE.ai.claudeModel, max_tokens:1000, messages:[{role:'user',content:prompt}] };
  if(STATE.ai.webSearch) body.tools = [{ type:'web_search_20250305', name:'web_search' }];
  const res = await fetchWithTimeout('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key':STATE.ai.claudeKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify(body)
  });
  if(!res.ok) {
    let msg = 'Claude API error ' + res.status;
    try {
      const errData = await res.json();
      if (errData.error && errData.error.message) {
        msg += ': ' + errData.error.message;
      }
    } catch(e) {}
    throw new Error(msg + ' — check key, or the browser may be blocking direct API calls (CORS). Try Sandbox mode.');
  }
  const data = await res.json();
  const textBlocks = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text);
  if(!textBlocks.length) throw new Error('Claude responded successfully but returned no usable text (possibly blocked by a safety filter, hit the token limit before producing text, or used an unsupported response type). Try again, rephrase, or switch provider in Settings.');
  return textBlocks.join('\n');
}
async function askGemini(prompt){
  if(!STATE.ai.geminiKey) throw new Error('No Gemini API key set in Settings.');
  const modelName = STATE.ai.geminiModel.startsWith('models/') ? STATE.ai.geminiModel.slice(7) : STATE.ai.geminiModel;
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${STATE.ai.geminiKey}`;
  const body = { contents:[{parts:[{text:prompt}]}] };
  if(STATE.ai.webSearch) body.tools = [{ google_search: {} }];
  const res = await fetchWithTimeout(url, {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-goog-api-key': STATE.ai.geminiKey
    },
    body: JSON.stringify(body)
  });
  if(!res.ok) {
    let msg = 'Gemini API error ' + res.status;
    try {
      const errData = await res.json();
      if (errData.error && errData.error.message) {
        msg += ': ' + errData.error.message;
      }
    } catch(e) {}
    throw new Error(msg + ' — check key.');
  }
  const data = await res.json();
  const parts = data.candidates?.[0]?.content?.parts || [];
  const text = parts.filter(p=>p.text).map(p=>p.text).join('\n');
  if(!text) throw new Error('Gemini responded successfully but returned no usable text (possibly blocked by a safety filter, hit the token limit before producing text, or used an unsupported response type). Try again, rephrase, or switch provider in Settings.');
  return text;
}
// Explicit keyword lists with word-boundary matching -- deriving a match keyword from the
// category label itself (e.g. "it" from "IT & Technology") is fragile: "it" as a bare substring
// matches inside "with", "unit", etc. Checked in list order; first match wins.
const CATEGORY_KEYWORDS = [
  ['Logistics & Freight', /\b(logistics?|freight|shipping|haulage|transport(ation)?|distribution|warehous\w*)\b/],
  ['IT & Technology', /\b(software|saas|cloud|technology|it system|application|hosting|data centre|data center)\b/],
  ['Telecom & Connectivity', /\b(telecom\w*|connectivity|broadband|network(ing)?|mobile carrier)\b/],
  ['Professional Services', /\b(consult\w*|advisory|professional services|legal services|audit\w*)\b/],
  ['Facilities & Estates', /\b(facilit\w*|estates?|building maintenance|cleaning services|security services)\b/],
  ['Marketing & Media', /\b(marketing|media\b|advertis\w*|campaign)\b/],
  ['HR & Recruitment', /\b(recruit\w*|staffing|payroll|human resources)\b/],
  ['Raw Materials & Manufacturing', /\b(raw material\w*|manufactur\w*|production line|components?)\b/],
  ['MRO / Indirect', /\b(mro\b|spare parts?|indirect spend)\b/],
  ['Construction & Capital Projects', /\b(construction|capital project\w*|civil works|building works)\b/],
  ['Financial Services', /\b(financial services|banking|insurance provider|payment processing|fintech)\b/]
];
function guessCategory(lowerText){
  const hit = CATEGORY_KEYWORDS.find(([,re]) => re.test(lowerText));
  return hit ? hit[0] : '';
}
function sandboxAnswer(prompt){
  // Offline, template-based draft — no network. Labelled honestly as Sandbox output.
  return new Promise(resolve=>{
    setTimeout(()=>{
      resolve(`[Sandbox draft — offline template, not model-generated]\n\nBased on the inputs provided, here is a structured first pass. Review and edit before use; connect Claude or Gemini in Settings for a fully drafted narrative.\n\n${prompt.slice(0,400)}${prompt.length>400?'…':''}`);
    }, 500);
  });
}
// Offline heuristic for Contract Intake's "Suggest with AI" step in Sandbox mode. Unlike
// sandboxAnswer() (a fixed template string for narrative-style prompts), this specific intake
// flow needs a structured object back to populate form fields -- so it can't just call
// sandboxAnswer() and JSON.parse() the result, since that always returns fixed prose, not JSON.
// Deterministic, no network -- same honesty-about-being-a-heuristic pattern as
// sandboxScoreContracts() below.
function sandboxSuggestContract(desc){
  const lower = desc.toLowerCase();
  let value=3, risk=3, criticality=3, impact=3;
  if(/sole source|single source|critical|core|master|strategic/.test(lower)){ risk++; criticality++; }
  if(/office|supplies|stationery|routine|misc|catering/.test(lower)){ value--; risk--; criticality--; impact--; }
  if(/cloud|it |software|data|security|technology/.test(lower)){ impact++; risk++; }
  if(/logistics|freight|supply chain|distribution/.test(lower)){ criticality++; value++; }
  const moneyMatch = desc.match(/\$?\s?([\d,]+(?:\.\d+)?)\s*(k|m|million|thousand)?/i);
  if(moneyMatch){
    let n = parseFloat(moneyMatch[1].replace(/,/g,''))||0;
    const unit = (moneyMatch[2]||'').toLowerCase();
    if(unit==='m'||unit==='million') n *= 1000000;
    else if(unit==='k'||unit==='thousand') n *= 1000;
    if(n>=1000000) value++;
    if(n>=5000000) value++;
  }
  let name = '';
  const nameMatch = desc.match(/(?:with|from)\s+([A-Z][\w&.,\-' ]{2,40}?)(?:[,.]| for | -|$)/);
  if(nameMatch) name = nameMatch[1].trim();
  const category = guessCategory(lower);
  const sentences = desc.split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(Boolean);
  const obligations = [], slas = [];
  sentences.forEach(s=>{
    const sl = s.toLowerCase();
    const trimmed = s.length>90 ? s.slice(0,90)+'…' : s;
    if(/renew|insurance|report|certificate|deliverable|notice/.test(sl)) obligations.push(trimmed);
    else if(/sla|uptime|on-time|on time|delivery|response time|%/.test(sl)) slas.push(trimmed);
  });
  return {
    name, category, value:clampScore(value), risk:clampScore(risk), criticality:clampScore(criticality), impact:clampScore(impact),
    obligations: obligations.slice(0,3), slas: slas.slice(0,3),
    rebateTier:'', rebateThreshold:'', rebateRatePct:0
  };
}
function clampScore(n){ n=parseInt(n)||3; return Math.max(1,Math.min(5,n)); }
function sandboxScoreContracts(names){
  // Deterministic offline heuristic — keyword-nudged, no network needed.
  return names.map(name=>{
    const lower = name.toLowerCase();
    let value=3, risk=3, criticality=3, impact=3;
    if(/sole source|single source|critical|core|master|strategic/.test(lower)){ risk++; criticality++; }
    if(/office|supplies|stationery|routine|misc|catering/.test(lower)){ value--; risk--; criticality--; impact--; }
    if(/cloud|it |software|data|security|technology/.test(lower)){ impact++; risk++; }
    if(/logistics|freight|supply chain|distribution/.test(lower)){ criticality++; value++; }
    return {name, value:clampScore(value), risk:clampScore(risk), criticality:clampScore(criticality), impact:clampScore(impact)};
  });
}
async function aiScoreBulkContracts(rawListText){
  const names = rawListText.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,30);
  if(!names.length) return [];
  if(STATE.ai.mode==='sandbox') return sandboxScoreContracts(names);
  const prompt = `For each contract/supplier name below, estimate procurement scores 1-5 for Value, Risk, Criticality, and Business Impact based on typical judgement for that category of spend. Return ONLY a JSON array, no commentary, no markdown fences, in this exact format: [{"name":"...","value":N,"risk":N,"criticality":N,"impact":N}]\n\nContracts:\n${names.join('\n')}`;
  try{
    const text = await askAI(prompt);
    const cleaned = text.replace(/```json|```/g,'').trim();
    const jsonStart = cleaned.indexOf('[');
    const jsonEnd = cleaned.lastIndexOf(']');
    const parsed = JSON.parse(cleaned.slice(jsonStart, jsonEnd+1));
    return parsed.map(p=>({name:p.name||'Unnamed', value:clampScore(p.value), risk:clampScore(p.risk), criticality:clampScore(p.criticality), impact:clampScore(p.impact)}));
  }catch(e){
    return sandboxScoreContracts(names); // graceful fallback if AI didn't return clean JSON
  }
}

function setScreen(id, fromTour){
  STATE.screen = id; NAV_MENU_OPEN = false; saveState();
  if(!fromTour && typeof tourIndex !== 'undefined' && tourIndex >= 0 && typeof TOUR !== 'undefined'){
    // Keep the tour card in sync if the person manually clicks a different tab mid-tour, rather
    // than leaving it narrating whatever screen the tour last pushed them to. Prefer the step
    // closest to the current one when a screen has several tour steps (e.g. Tiering, QBR), so
    // re-clicking the same tab doesn't always snap back to its first sub-step.
    const candidates = TOUR.map((s,i)=>({s,i})).filter(x=>x.s.screen===id);
    if(candidates.length){
      candidates.sort((a,b)=> Math.abs(a.i-tourIndex) - Math.abs(b.i-tourIndex));
      tourIndex = candidates[0].i;
      render(); renderFloaterTips();
      renderTourOverlay(TOUR[tourIndex]);
      return;
    }
  }
  render(); renderFloaterTips();
}

// Shared creation path used by the manual form, the AI-assisted description, and the offline
// CSV template import -- one function, so all three intake routes produce exactly the same
// downstream shape (tieringBulk row + Register items + optional rebate + QBR record).
function createContractRecord(f){
  const axes = {value:clampScore(f.value)||3, risk:clampScore(f.risk)||3, criticality:clampScore(f.criticality)||3, impact:clampScore(f.impact)||3};
  upsertTieringBulkRow(f.name, axes);
  const bulkRow = STATE.tieringBulk.find(r=>normalizeSupplierName(r.name)===normalizeSupplierName(f.name));
  if(bulkRow){ bulkRow.category = f.category||bulkRow.category||''; bulkRow.startDate = f.startDate||bulkRow.startDate||''; bulkRow.endDate = f.endDate||bulkRow.endDate||''; }
  const parseLines = (raw, type) => (raw||'').split('\n').map(l=>l.trim()).filter(Boolean).map(line=>{
    const m = line.match(/\(([\d]{4}-[\d]{2}-[\d]{2})\)\s*$/);
    const dueDate = m ? m[1] : new Date(Date.now()+90*86400000).toISOString().slice(0,10);
    const description = m ? line.replace(m[0],'').trim() : line;
    return {id:uid(), type, contract:f.name, description, owner:'', dueDate, recurrence:'One-off', status:'Open'};
  });
  const newItems = [...parseLines(f.obligationsRaw,'Obligation'), ...parseLines(f.slasRaw,'SLA')];
  STATE.register.push(...newItems);
  let rebateAdded = false;
  if((f.rebateThreshold||'').toString().trim() || (f.rebateRate||'').toString().trim()){
    STATE.rebates.push({id:uid(), contractName:f.name, tierName:f.rebateTier||'Rebate tier', threshold:f.rebateThreshold||'', ratePct:Number(f.rebateRate)||0, spendToDate:Number(f.rebateSpend)||0, status:'Open'});
    rebateAdded = true;
  }
  if(f.makeActive) STATE.activeContract = {id:uid(), name:f.name, text:'', truncNote:'', pageOffsets:[]};
  openOrCreateQbrFor(f.name, (f.makeActive && STATE.activeContract) ? STATE.activeContract.id : '');
  return {itemCount:newItems.length, rebateAdded};
}
const INTAKE_CSV_HEADERS = ['name','category','startdate','enddate','value','risk','criticality','impact','obligations','slas','rebatetier','rebatethreshold','rebateratepct','rebatespendtodate'];
function downloadIntakeTemplate(){
  const header = ['Name','Category','StartDate (YYYY-MM-DD)','EndDate (YYYY-MM-DD)','Value (1-5)','Risk (1-5)','Criticality (1-5)','Impact (1-5)','Obligations (semicolon-separated, optional (YYYY-MM-DD) per item)','SLAs (semicolon-separated)','RebateTier','RebateThreshold','RebateRatePct','RebateSpendToDate'];
  const example = ['Global Logistics Co','Logistics & Freight','2025-01-01','2028-01-01','4','3','4','3','Insurance renewal (2027-01-15); Quarterly usage report','On-time delivery >=98%; System uptime >=99.9%','Volume rebate','>$500,000 annual','2','320000'];
  const csvEscape = v => /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  const csv = [header, example].map(row=>row.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'CLM_Suite_Contract_Intake_Template.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
// Minimal CSV parser (handles quoted fields with embedded commas/newlines) -- no external
// library needed for this app's one use case. Returns {rows, headerDetected, error}:
// - error: set (and rows empty) if the content doesn't look like real text CSV at all (e.g. a
//   binary file renamed .csv) -- refuses to parse rather than manufacturing garbage records.
// - headerDetected: true only if row 0's first cell actually reads like "Name" -- a headerless
//   file is NOT blindly sliced (which used to silently drop its first real contract); every row
//   is treated as data instead, and the caller can warn if headerDetected came back false.
function parseIntakeCsv(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  const pushField = ()=>{ row.push(field); field=''; };
  const pushRow = ()=>{ pushField(); rows.push(row); row=[]; };
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field += c;
    }else{
      if(c==='"') inQuotes = true;
      else if(c===',') pushField();
      else if(c==='\r'){ /* skip */ }
      else if(c==='\n') pushRow();
      else field += c;
    }
  }
  if(field.length || row.length) pushRow();
  if(!rows.length) return {rows:[], headerDetected:false, error:null};

  const controlCharCount = (text.match(/[\x00-\x08\x0E-\x1F\uFFFD]/g)||[]).length;
  if(controlCharCount > text.length*0.02 || controlCharCount > 20){
    return {rows:[], headerDetected:false, error:"This file doesn't look like plain text CSV — it may be a binary file (e.g. a renamed .xlsx, .docx, or .pdf) rather than a real .csv export. Re-download the template and save your data as CSV."};
  }

  const firstCell = (rows[0][0]||'').trim().toLowerCase();
  const headerDetected = firstCell==='name' || firstCell.startsWith('name ') || firstCell.startsWith('name(');
  const dataRows = (headerDetected ? rows.slice(1) : rows).filter(r=>r.some(v=>v && v.trim()));

  const parsedRows = dataRows.map(r=>{
    const obj = {};
    INTAKE_CSV_HEADERS.forEach((key,i)=>{ obj[key] = (r[i]||'').trim(); });
    return obj;
  }).filter(obj=>{
    if(!obj.name) return false;
    if(obj.name.length > 200) return false;
    if(/[\x00-\x08\x0E-\x1F\uFFFD]/.test(obj.name)) return false;
    return true;
  });

  return {rows:parsedRows, headerDetected, error:null};
}

// Session-only (not persisted): shown once per session, the first time a document is uploaded
// while Sandbox mode is active AND a Gemini key happens to be stored -- confirms Sandbox was
// genuinely honored for that specific upload, rather than leaving the user to just trust it.
let SANDBOX_REASSURANCE_MSG = '';
let SANDBOX_REASSURANCE_SHOWN = false;
// Session-only: shown once per session, the first time a document is uploaded while a non-Sandbox
// mode is active AND a Gemini key is actually stored (i.e. a real transmission is about to

function renderHeatmapSVG(bulk){
  const w=680,h=380,pad=44;
  const pts = bulk.map(r=>{
    const score = weightedScore(r); const tier = getTier(score);
    const x = pad + ((r.value-1)/4)*(w-2*pad);
    const y = h-pad - ((r.risk-1)/4)*(h-2*pad);
    const size = 6 + (r.criticality-1)*2.2;
    return {x,y,size,tier,name:r.name,score};
  });
  const colorOf = {t1:'#7a2e2e',t2:'#a8792e',t3:'#3a6b5c',t4:'#6b7280',terr:'#c0392b'};
  const gsbColorOf = {t1:'#a8792e',t2:'#7c8591',t3:'#8c5a3c',t4:'#8c5a3c',terr:'#c0392b'};
  const useColor = STATE.tierScheme==='gsb' ? gsbColorOf : colorOf;
  const dots = pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.size.toFixed(1)}" fill="${useColor[p.tier.code]}" fill-opacity="0.85" stroke="#ffffff" stroke-width="1.5"><title>${esc(p.name)} — score ${p.score.toFixed(1)} (${esc(tierDisplayName(p.tier.code))})</title></circle>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;background:#fff;border:1px solid var(--line);">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#dcd9d0"/>
    <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="#dcd9d0"/>
    <text x="${pad}" y="${pad-14}" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#6b6459">CRITICAL</text>
    <text x="${w-pad}" y="${pad-14}" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#6b6459" text-anchor="end">STRATEGIC</text>
    <text x="${pad}" y="${h-pad+24}" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#6b6459">ROUTINE</text>
    <text x="${w-pad}" y="${h-pad+24}" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#6b6459" text-anchor="end">LEVERAGE</text>
    <text x="${w/2}" y="${h-8}" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#6b6459" text-anchor="middle">VALUE →</text>
    <text x="14" y="${h/2}" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#6b6459" text-anchor="middle" transform="rotate(-90 14 ${h/2})">RISK →</text>
    ${dots}
  </svg>`;
}

/* ========== QBR ========== */
function blankQbrShape(){
  return {id:'', supplier:'', contractId:'', period:'', kpis:[], slas:[], rebates:'', risks:'', actions:'', narrative:'', recommendations:''};
}
// Upserts the currently-open STATE.qbr into the STATE.qbrs collection (keyed by STATE.qbrOpenId),
// then persists. Called in place of a bare saveState() from anywhere that edits STATE.qbr, so the
// picker list and Governance's cross-QBR aggregation always see the latest edits. A QBR with no
// supplier name yet isn't filed into the collection -- it stays a scratch draft until named.
function saveQbr(){
  if(STATE.qbr.supplier){
    if(!STATE.qbrOpenId){ STATE.qbrOpenId = uid(); }
    STATE.qbr.id = STATE.qbrOpenId;
    const snapshot = JSON.parse(JSON.stringify(STATE.qbr));
    const idx = STATE.qbrs.findIndex(x=>x.id===STATE.qbrOpenId);
    if(idx>=0) STATE.qbrs[idx] = snapshot; else STATE.qbrs.push(snapshot);
  }
  saveState();
}
function openQbr(id){
  const found = STATE.qbrs.find(x=>x.id===id);
  if(!found) return;
  STATE.qbr = JSON.parse(JSON.stringify(found));
  STATE.qbrOpenId = id;
  saveState();
}
function openNewQbr(prefill){
  STATE.qbr = Object.assign(blankQbrShape(), prefill||{});
  STATE.qbrOpenId = null;
  saveState();
}
function deleteQbr(id){
  STATE.qbrs = STATE.qbrs.filter(x=>x.id!==id);
  if(STATE.qbrOpenId===id) openNewQbr();
  saveState();
}
// Opens the existing QBR for a supplier/contract if one exists, otherwise starts a fresh one
// prefilled with that supplier/contractId -- used by the intake form and the contract-upload flow
// so a new contract gets its own QBR record rather than silently overwriting whichever QBR was
// last open.
function openOrCreateQbrFor(supplier, contractId){
  const norm = normalizeSupplierName(supplier);
  const existing = STATE.qbrs.find(x=>normalizeSupplierName(x.supplier)===norm);
  if(existing) openQbr(existing.id);
  else openNewQbr({supplier, contractId});
}
// Upserts a tieringBulk row for a named contract -- creates one if none exists (matched by
// normalized name), or refreshes the axis scores on the existing one if it does. Used so every
// "add a contract" entry point (Contract Intake, Tiering document-upload) produces the same
// downstream shape: a row in the portfolio table/heatmap, not just an activeContract + QBR.
function upsertTieringBulkRow(name, scores){
  if(!name) return;
  const norm = normalizeSupplierName(name);
  const idx = STATE.tieringBulk.findIndex(r=>normalizeSupplierName(r.name)===norm);
  if(idx>=0){
    STATE.tieringBulk[idx] = Object.assign({}, STATE.tieringBulk[idx], {
      value: scores.value, risk: scores.risk, criticality: scores.criticality, impact: scores.impact
    });
  }else{
    STATE.tieringBulk.push({id:uid(), name, value:scores.value, risk:scores.risk, criticality:scores.criticality, impact:scores.impact, unspscCode:'', cpvCode:''});
  }
}
function normalizeSupplierName(s){
  return (s||'').toLowerCase().trim()
    .replace(/[.,]/g,'')
    .replace(/\b(inc|incorporated|ltd|limited|llc|corp|corporation|co|company|plc|gmbh)\b\.?/g,'')
    .replace(/\s+/g,' ').trim();
}
// Matches by stable contract identity first (reliable, no name normalization needed), falling
// back to the existing exact/fuzzy name matching for rows with no contractId (manually entered,
// or predating this feature) or when no contractId is available to match against at all.
function matchByContractField(list, supplierName, field, contractId, idField){
  if(contractId && idField){
    const byId = list.filter(r=> r[idField] && r[idField]===contractId);
    if(byId.length) return {matches:byId, matchType:'id', variants:[]};
  }
  const target = normalizeSupplierName(supplierName);
  if(!target) return {matches:[], matchType:'none', variants:[]};
  const exact = list.filter(r=> normalizeSupplierName(r[field]||'')===target);
  if(exact.length) return {matches:exact, matchType:'exact', variants:[]};
  const fuzzy = list.filter(r=>{
    const sub = normalizeSupplierName(r[field]||'');
    return sub.length>=4 && target.length>=4 && (sub.includes(target)||target.includes(sub));
  });
  const variants = [...new Set(fuzzy.map(r=>r[field]))];
  return {matches:fuzzy, matchType: fuzzy.length?'fuzzy':'none', variants};
}
function getRegisterForSupplier(supplierName, contractId){ return matchByContractField(STATE.register, supplierName, 'contract', contractId, 'contractId'); }
function getRebatesForSupplier(supplierName){ return matchByContractField(STATE.rebates, supplierName, 'contractName'); }
function buildQbrRecommendations(q, matchedReg, matchedRebates, feedback){
  const recs = [];
  const breachedKpi = q.kpis.filter(k=>k.status==='Breached');
  const atRiskKpi = q.kpis.filter(k=>k.status==='At risk');
  const breachedSla = q.slas.filter(k=>k.status==='Breached');
  const atRiskSla = q.slas.filter(k=>k.status==='At risk');
  if(breachedSla.length) recs.push(`Escalate ${breachedSla.length} breached SLA(s) and agree a remediation timeline with the supplier before the next cycle.`);
  if(breachedKpi.length) recs.push(`Address ${breachedKpi.length} breached KPI(s) — request a root-cause and corrective action plan.`);
  if(atRiskSla.length || atRiskKpi.length) recs.push(`Monitor ${atRiskSla.length+atRiskKpi.length} at-risk KPI/SLA metric(s) closely ahead of the next review.`);
  const disputedRebates = matchedRebates.filter(r=>r.status==='Disputed');
  if(disputedRebates.length) recs.push(`Resolve ${disputedRebates.length} disputed rebate tier(s) before the next reconciliation cycle.`);
  const overdueItems = matchedReg.filter(r=> r.status!=='Complete' && r.dueDate && daysUntil(r.dueDate)<0);
  if(overdueItems.length) recs.push(`Close ${overdueItems.length} overdue obligation/SLA/change-order item(s) linked to this contract.`);
  const avgRating = feedback.length ? feedback.reduce((a,f)=>a+(Number(f.rating)||0),0)/feedback.length : null;
  if(avgRating!==null && avgRating<3) recs.push('Stakeholder sentiment is below neutral — schedule a relationship review with key stakeholders.');
  if(!recs.length) recs.push('No material issues flagged from current data — maintain current cadence.');
  return recs;
}
function getFeedbackForSupplier(supplierName){
  const target = normalizeSupplierName(supplierName);
  if(!target) return {matches:[], matchType:'none', variants:[]};
  const exact = STATE.coverage.feedback.filter(f=> normalizeSupplierName(f.subject)===target);
  if(exact.length) return {matches:exact, matchType:'exact', variants:[]};
  const fuzzy = STATE.coverage.feedback.filter(f=>{
    const sub = normalizeSupplierName(f.subject);
    return sub.length>=4 && target.length>=4 && (sub.includes(target) || target.includes(sub));
  });
  const variants = [...new Set(fuzzy.map(f=>f.subject))];
  return {matches:fuzzy, matchType: fuzzy.length ? 'fuzzy' : 'none', variants};
}
function renderQbrPicker(){
  const isNewDraft = !STATE.qbrOpenId;
  const openBadgeStatus = (qbr)=>{

    if(breached) return `<span class="badge overdue">${breached} breached</span>`;
    if(atRisk) return `<span class="badge due">${atRisk} at risk</span>`;

    `${STATE.qbrs.length ? `<table><thead><tr><th>Supplier</th><th>Period</th><th>Status</th><th></th></tr></thead><tbody>
      ${STATE.qbrs.map(qb=>`<tr>

function wireQbrPicker(){

function renderQBR(){
  const q = STATE.qbr;

  const active = STATE.activeContract && STATE.activeContract.name;
  return `

function renderQbrLine(item,kind){
  return `<tr data-line="${item.id}" data-kind="${kind}">
    <td><input type="text" data-f="name" value="${esc(item.name)}" style="width:150px;"></td>
    <td><input type="text" data-f="target" value="${esc(item.target)}" style="width:80px;"></td>
    <td><input type="text" data-f="actual" value="${esc(item.actual)}" style="width:80px;"></td>
    <td><select data-f="status"><option ${item.status==='On track'?'selected':''}>On track</option><option ${item.status==='At risk'?'selected':''}>At risk</option><option ${item.status==='Breached'?'selected':''}>Breached</option></select></td>
    <td><button class="btn danger small" data-delline="${item.id}" data-kind="${kind}">✕</button></td>
  </tr>`;
}

/* ========== COVERAGE & FEEDBACK ========== */
function renderCoverage(){
  const c = STATE.coverage;
  const totalSpend = c.categories.reduce((a,r)=>a+(Number(r.spend)||0),0);
  const weightedCovered = c.categories.reduce((a,r)=>a+(Number(r.spend)||0)*(Number(r.pctContract)||0)/100,0);
  const overallPct = totalSpend ? (weightedCovered/totalSpend*100) : 0;
  return `
  <h2>Stakeholder Feedback, Spend & Category Coverage</h2>
  <p class="muted">The part of the framework that's usually only prose — here it's three live logs feeding one number: % of spend under active contract.</p>
  <div class="result-strip"><div><div class="eyebrow" style="color:#a39a89;">Spend under active contract</div><div class="tname">${overallPct.toFixed(0)}%</div></div>
    <div class="tscore small mono">$${totalSpend.toLocaleString(undefined,{maximumFractionDigits:0})} total tracked</div></div>

  <div class="card">
    <div class="flex-between"><h3 style="margin:0;">Category spend coverage</h3>
      <div class="row"><button class="btn small outline" id="btnAddCategory">+ Add category</button><button class="btn small outline" id="btnCatCSV">Export CSV</button></div>
    </div>
    <table style="margin-top:10px;"><thead><tr><th>Category</th><th>Annual spend ($)</th><th>% under contract</th><th>Coverage</th><th></th></tr></thead>
    <tbody>${c.categories.map(r=>renderCategoryRow(r)).join('') || '<tr><td colspan="5" class="small muted">No categories yet.</td></tr>'}</tbody></table>
    ${c.categories.length ? `<hr class="divider"><div id="chartCoverageBar" style="min-height:${Math.max(c.categories.length*30,120)}px;"></div>` : ''}
  </div>

  <div class="card">
    <div class="flex-between"><h3 style="margin:0;">Stakeholder feedback</h3>
      <div class="row"><button class="btn small outline" id="btnAddFeedback">+ Add feedback</button><button class="btn small outline" id="btnFbCSV">Export CSV</button></div>
    </div>
    <table style="margin-top:10px;"><thead><tr><th>Contract/Supplier</th><th>Stakeholder</th><th>Date</th><th>Rating (1–5)</th><th>Comment</th><th></th></tr></thead>
    <tbody>${c.feedback.map(r=>renderFeedbackRow(r)).join('') || '<tr><td colspan="6" class="small muted">No feedback logged yet.</td></tr>'}</tbody></table>
  </div>

  <div class="card">
    <div class="flex-between"><h3 style="margin:0;">Supplier collaboration opportunities</h3>
      <div class="row"><button class="btn small outline" id="btnAddCollab">+ Add opportunity</button><button class="btn small outline" id="btnCollabCSV">Export CSV</button></div>
    </div>
    <table style="margin-top:10px;"><thead><tr><th>Supplier</th><th>Type</th><th>Description</th><th>Status</th><th></th></tr></thead>
    <tbody>${c.collaboration.map(r=>renderCollabRow(r)).join('') || '<tr><td colspan="5" class="small muted">No opportunities logged yet.</td></tr>'}</tbody></table>
  </div>`;
}
function renderCategoryRow(r){
  const status = r.pctContract>=90?'ok':(r.pctContract>=50?'due':'overdue');
  const statusLabel = r.pctContract>=90?'Covered':(r.pctContract>=50?'Partial':'White space');
  return `<tr data-cat="${r.id}">
    <td><input type="text" data-f="name" value="${esc(r.name)}" style="width:140px;"></td>
    <td><input type="number" data-f="spend" value="${r.spend}" style="width:110px;"></td>
    <td><input type="number" min="0" max="100" data-f="pctContract" value="${r.pctContract}" style="width:70px;"></td>
    <td><span class="badge ${status}">${statusLabel}</span></td>
    <td><button class="btn danger small" data-delcat="${r.id}">✕</button></td>
  </tr>`;
}
function renderFeedbackRow(r){
  return `<tr data-fb="${r.id}">
    <td><input type="text" data-f="subject" value="${esc(r.subject)}" style="width:120px;"></td>
    <td><input type="text" data-f="stakeholder" value="${esc(r.stakeholder)}" style="width:100px;"></td>
    <td><input type="date" data-f="date" value="${esc(r.date)}"></td>
    <td><input type="number" min="1" max="5" data-f="rating" value="${r.rating}" style="width:50px;"></td>
    <td><input type="text" data-f="comment" value="${esc(r.comment)}" style="width:180px;"></td>
    <td><button class="btn danger small" data-delfb="${r.id}">✕</button></td>
  </tr>`;
}
function renderCollabRow(r){
  return `<tr data-collab="${r.id}">
    <td><input type="text" data-f="supplier" value="${esc(r.supplier)}" style="width:120px;"></td>
    <td><select data-f="type"><option ${r.type==='Joint business plan'?'selected':''}>Joint business plan</option><option ${r.type==='Innovation'?'selected':''}>Innovation</option><option ${r.type==='Gain-share'?'selected':''}>Gain-share</option><option ${r.type==='ESG/Sustainability'?'selected':''}>ESG/Sustainability</option></select></td>
    <td><input type="text" data-f="description" value="${esc(r.description)}" style="width:180px;"></td>
    <td><select data-f="status"><option ${r.status==='Idea'?'selected':''}>Idea</option><option ${r.status==='In progress'?'selected':''}>In progress</option><option ${r.status==='Delivered'?'selected':''}>Delivered</option></select></td>
    <td><button class="btn danger small" data-delcollab="${r.id}">✕</button></td>
  </tr>`;
}
function categoryChartData(cats){
  return cats.map(r=>({
    label: r.name||'(unnamed)',
    value: Number(r.pctContract)||0,
    color: (r.pctContract>=90)?'#2f6f4f':((r.pctContract>=50)?'#b8892f':'#a13b3b')
  }));
}
function wireCoverage(){
  const c = STATE.coverage;
  if(c.categories.length) mountChart('chartCoverageBar', 420, Math.max(c.categories.length*30,120), (ctx,w,h)=> drawBarChart(ctx,w,h, categoryChartData(c.categories), {labelWidth:110, unit:'pct', max:100}));
  document.getElementById('btnAddCategory').addEventListener('click',()=>{ c.categories.push({id:uid(),name:'',spend:0,pctContract:0}); saveState(); render(); });
  document.getElementById('btnAddFeedback').addEventListener('click',()=>{ c.feedback.push({id:uid(),subject:'',stakeholder:'',date:'',rating:3,comment:''}); saveState(); render(); });
  document.getElementById('btnAddCollab').addEventListener('click',()=>{ c.collaboration.push({id:uid(),supplier:'',type:'Joint business plan',description:'',status:'Idea'}); saveState(); render(); });

  document.querySelectorAll('tr[data-cat]').forEach(tr=>{
    const id = tr.dataset.cat;
    tr.querySelectorAll('[data-f]').forEach(inp=> inp.addEventListener('change', e=>{
      const row = c.categories.find(r=>r.id===id); const f=e.target.dataset.f;
      row[f] = (f==='spend'||f==='pctContract') ? (parseFloat(e.target.value)||0) : e.target.value;
      saveState(); render();
    }));
  });
  document.querySelectorAll('[data-delcat]').forEach(b=> b.addEventListener('click',()=>{ c.categories=c.categories.filter(r=>r.id!==b.dataset.delcat); saveState(); render(); }));

  document.querySelectorAll('tr[data-fb]').forEach(tr=>{
    const id = tr.dataset.fb;
    tr.querySelectorAll('[data-f]').forEach(inp=> inp.addEventListener('change', e=>{
      const row = c.feedback.find(r=>r.id===id); const f=e.target.dataset.f;
      row[f] = f==='rating' ? (parseInt(e.target.value)||3) : e.target.value;
      saveState(); render();
    }));
  });
  document.querySelectorAll('[data-delfb]').forEach(b=> b.addEventListener('click',()=>{ c.feedback=c.feedback.filter(r=>r.id!==b.dataset.delfb); saveState(); render(); }));

  document.querySelectorAll('tr[data-collab]').forEach(tr=>{
    const id = tr.dataset.collab;
    tr.querySelectorAll('[data-f]').forEach(inp=> inp.addEventListener('change', e=>{
      const row = c.collaboration.find(r=>r.id===id);
      row[e.target.dataset.f] = e.target.value;
      saveState(); render();
    }));
  });
  document.querySelectorAll('[data-delcollab]').forEach(b=> b.addEventListener('click',()=>{ c.collaboration=c.collaboration.filter(r=>r.id!==b.dataset.delcollab); saveState(); render(); }));

  document.getElementById('btnCatCSV').addEventListener('click',()=>{
    exportCSV('category_coverage.csv', ['Category','Annual spend','% under contract'], c.categories.map(r=>[r.name,r.spend,r.pctContract]));
  });
  document.getElementById('btnFbCSV').addEventListener('click',()=>{
    exportCSV('stakeholder_feedback.csv', ['Contract/Supplier','Stakeholder','Date','Rating','Comment'], c.feedback.map(r=>[r.subject,r.stakeholder,r.date,r.rating,r.comment]));
  });
  document.getElementById('btnCollabCSV').addEventListener('click',()=>{
    exportCSV('collaboration_opportunities.csv', ['Supplier','Type','Description','Status'], c.collaboration.map(r=>[r.supplier,r.type,r.description,r.status]));
  });
}

/* ========== REBATES ========== */

  const active = STATE.activeContract && STATE.activeContract.name;
  return `
  <h2>Rebate Monitoring</h2>
  <p style="margin:-6px 0 6px;">${active ? `<span class="badge ok" style="padding: 6px 10px;">📄 Active: ${esc(STATE.activeContract.name)}</span>` : '<span class="small muted">No active contract loaded — "AI Extract Rebates" needs one (upload on 0 · Tiering, or create via Contract Intake). Manual entry below works either way.</span>'}</p>
  <p class="muted">Track tier thresholds against actual spend — accrued entitlement is calculated live from what you earn, not typed in separately. Rows here come from manual entry, Contract Intake, the offline template, or "AI Extract Rebates" against an active document — whichever you used.</p>
  ${rows.length ? `<div class="card"><h3>Accrued entitlement by tier</h3><p class="small muted" style="margin-top:-6px;">Dollar value owed per rebate tier — spend to date × rate %. Bar length and the number on the right are that calculated amount, not raw spend.</p><div id="chartRebateBar" style="min-height:${Math.max(rows.length*30,120)}px;"></div></div>` : ''}
  <div class="card">
    <div class="flex-between"><span class="muted small">${rows.length} tier(s)</span>
      <div class="row" style="align-items:center;gap:6px;">
        ${active ? `<button class="btn small gold" id="btnRebatesAiExtract">AI Extract Rebates</button>` : ''}
        <button class="btn small outline" id="btnAddRebate">+ Add tier</button>
        <button class="btn small outline" id="btnRebateCSV">Export CSV</button>
        <button class="btn small outline" id="btnRebateWord">Export Word</button>
      </div>
    </div>
    <table style="margin-top:10px;"><thead><tr><th>Contract</th><th>Tier</th><th>Threshold</th><th>Spend to date ($)</th><th>Rate (%)</th><th>Accrued</th><th>Status</th><th></th></tr></thead>
    <tbody>
      ${rows.map(r=>renderRebateRow(r)).join('') || '<tr><td colspan="8" class="small muted">No rebate tiers yet — add one, or use a "+ Add starter rebate tiers" button on the Contract Playbook (Section 4).</td></tr>'}
    </tbody></table>
  </div>`;
}
function renderRebateRow(r){
  const accrued = (Number(r.spendToDate)||0)*(Number(r.ratePct)||0)/100;
  return `<tr data-rebate="${r.id}">
    <td><input type="text" data-f="contractName" value="${esc(r.contractName)}" style="width:110px;"></td>
    <td><input type="text" data-f="tierName" value="${esc(r.tierName)}" style="width:70px;"></td>
    <td><input type="text" data-f="threshold" value="${esc(r.threshold)}" style="width:140px;"></td>
    <td><input type="number" data-f="spendToDate" value="${r.spendToDate}" style="width:100px;"></td>
    <td><input type="number" data-f="ratePct" value="${r.ratePct}" style="width:60px;"></td>
    <td class="mono">$${accrued.toLocaleString(undefined,{maximumFractionDigits:0})}</td>
    <td><select data-f="status"><option ${r.status==='Open'?'selected':''}>Open</option><option ${r.status==='Reconciled'?'selected':''}>Reconciled</option><option ${r.status==='Disputed'?'selected':''}>Disputed</option></select></td>
    <td><button class="btn danger small" data-delrebate="${r.id}">✕</button></td>
  </tr>`;
}
function rebateChartData(rows){
  return rows.map(r=>({
    label: (r.contractName||'—')+' '+(r.tierName||''),
    value: (Number(r.spendToDate)||0)*(Number(r.ratePct)||0)/100,
    color: r.status==='Reconciled'?'#2f6f4f':(r.status==='Disputed'?'#a13b3b':'#a8792e')
  }));
}
function wireRebates(){
  if(STATE.rebates.length) mountChart('chartRebateBar', 420, Math.max(STATE.rebates.length*30,120), (ctx,w,h)=> drawBarChart(ctx,w,h, rebateChartData(STATE.rebates), {labelWidth:170}));
  document.getElementById('btnAddRebate').addEventListener('click',()=>{
    STATE.rebates.push({id:uid(), contractName:'', tierName:'', threshold:'', ratePct:0, spendToDate:0, status:'Open'});
    saveState(); render();
  });

  const rebatesAiBtn = document.getElementById('btnRebatesAiExtract');
  if(rebatesAiBtn){
    rebatesAiBtn.addEventListener('click', async ()=>{
      if(!STATE.activeContract || !STATE.activeContract.text) return;
      rebatesAiBtn.disabled = true; rebatesAiBtn.textContent = 'Extracting…';
      try{
        const { final } = await chooseAndRunDocumentReview();
        if(!final.rebateTiers.length){
          alert('No rebate terms detected in contract text.');
        }else{
          final.rebateTiers.forEach(r=>{
            STATE.rebates.push({id:uid(), contractName:STATE.activeContract.name, tierName:r.tierName||'Rebate tier', threshold:r.threshold||'', ratePct:Number(r.ratePct)||0, spendToDate:0, status:'Open'});
          });
          saveState();
          render();
        }
      }catch(err){
        alert('Extraction failed: ' + err.message);
      }
      rebatesAiBtn.disabled = false; rebatesAiBtn.textContent = 'AI Extract Rebates';
    });
  }
  document.querySelectorAll('tr[data-rebate]').forEach(tr=>{
    const id = tr.dataset.rebate;
    tr.querySelectorAll('[data-f]').forEach(inp=>{
      inp.addEventListener('change', e=>{
        const row = STATE.rebates.find(r=>r.id===id);
        const f = e.target.dataset.f;
        row[f] = (f==='spendToDate'||f==='ratePct') ? (parseFloat(e.target.value)||0) : e.target.value;
        saveState(); render();
      });
    });
  });
  document.querySelectorAll('[data-delrebate]').forEach(b=>{
    b.addEventListener('click',()=>{ STATE.rebates = STATE.rebates.filter(r=>r.id!==b.dataset.delrebate); saveState(); render(); });
  });
  document.getElementById('btnRebateCSV').addEventListener('click',()=>{
    const rows = STATE.rebates.map(r=>[r.contractName,r.tierName,r.threshold,r.spendToDate,r.ratePct,((Number(r.spendToDate)||0)*(Number(r.ratePct)||0)/100).toFixed(0),r.status]);

  document.getElementById('btnRebateWord').addEventListener('click',()=>{
    const rows = STATE.rebates.map(r=>[r.contractName,r.tierName,r.threshold,'$'+r.spendToDate,r.ratePct+'%','$'+((Number(r.spendToDate)||0)*(Number(r.ratePct)||0)/100).toFixed(0),r.status]);
    const blocks = [];
    if(STATE.rebates.length) blocks.push({h:2,text:'Accrued entitlement by tier'}, {image: chartDataUrl(420, Math.max(STATE.rebates.length*30,120), (ctx,w,h)=>drawBarChart(ctx,w,h,rebateChartData(STATE.rebates),{labelWidth:170})), width:380, height:Math.max(STATE.rebates.length*27,108)});
    blocks.push({table:{headers:['Contract','Tier','Threshold','Spend to date','Rate','Accrued','Status'], rows}});
    exportDocxReal('Rebate Tracker', blocks);
  });
}
